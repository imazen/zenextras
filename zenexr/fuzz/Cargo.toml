[package]
name = "zenexr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
enough = { version = "0.4.4", default-features = false }

[dependencies.zenexr]
path = ".."
features = ["inventory"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[patch.crates-io]
# The zencodec 0.2 core family of the parent workspace (zenpipe's 6214c93c).
zencodec = { git = "https://github.com/imazen/zencodec", rev = "6214c93c24d35769a34a9561fe844c717e4d3a3a" }

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false
