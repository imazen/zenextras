[package]
name = "zenexr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
enough = { version = "0.4.4", default-features = false }

[dependencies.zenexr]
path = ".."
features = ["inventory"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "96c7b1efb10e0a645c6854294178c33f4bad7865" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "96c7b1efb10e0a645c6854294178c33f4bad7865" }
# The zencodec 0.2 core family of the parent workspace (main f02a17ec).
zencodec = { git = "https://github.com/imazen/zencodec", rev = "f02a17ec6001a9efcad1267f92a3ea928ed06e57" }

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false
