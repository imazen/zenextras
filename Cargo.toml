[workspace]
resolver = "2"
members = [
    "zentiff",
    "zensvg",
    "zenjp2",
    "zenpdf",
    "zenexr",
    "zenpsd",
    "zenivf",
    "zenwebm",
]

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
# One unpublished core family from the Zenpixels 0.5 integration. Members use registry
# requirements so downstream consumers can choose one family with their root patch.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "037ef59b57ae003f853a5b6624b173edfee22d6a" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "037ef59b57ae003f853a5b6624b173edfee22d6a" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "037ef59b57ae003f853a5b6624b173edfee22d6a" }
zencodec-media = { git = "https://github.com/imazen/zencodec", rev = "037ef59b57ae003f853a5b6624b173edfee22d6a" }
zencodec-media-testkit = { git = "https://github.com/imazen/zencodec", rev = "037ef59b57ae003f853a5b6624b173edfee22d6a" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "037ef59b57ae003f853a5b6624b173edfee22d6a" }
# Zenpixels and its converter are pinned to the same source revision.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "42a0c5c83c5c418950eb528d92d57788f6700bcf" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "42a0c5c83c5c418950eb528d92d57788f6700bcf" }
# Zenjpeg and Ultrahdr Core share the pinned Zenpixels and zencodec contracts.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "607614ce9b1027edac600b52e61c99fe18f5cb46" }
# Pinned PDF stream resource-limit fork used by zenpdf.
hayro-syntax = { git = "https://github.com/lilith/hayro", rev = "2ce50d0164878b8505e118f81dcb1d0367b26957" }

# Zenjpeg PR 265 supplies the 8-bit and 12-bit decoder for TIFF JPEG pages.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "20237e62be7713d405ed471b66a87e715cd5ca41" }

# Pinned TIFF scratch-buffer resource-limit fork used by zentiff.
tiff = { git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5" }
