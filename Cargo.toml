[workspace]
resolver = "2"
members = [
    "zentiff",
    "zensvg",
    "zenjp2",
    "zenpdf",
    "zenexr",
    "zenpsd",
    "zenivf",
    "zenwebm",
]

[patch.crates-io]
# Unpublished metadata implementation under review; one contract version for all consumers.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }
# Pinned PDF stream resource-limit fork used by zenpdf.
hayro-syntax = { git = "https://github.com/lilith/hayro", rev = "2ce50d0164878b8505e118f81dcb1d0367b26957" }

# zenjpeg 0.9.0 (unreleased; byte-exact with libjpeg-turbo, 12-bit and lossless decode) for
# zentiff's JPEG pages. Drop once it is on crates.io.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "cf7b051ba9c198ff7b1cd222552e9d17a29b0513" }

# Pinned TIFF scratch-buffer resource-limit fork used by zentiff.
tiff = { git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5" }
