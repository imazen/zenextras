[workspace]
resolver = "2"
members = [
    "zentiff",
    "zensvg",
    "zenjp2",
    "zenpdf",
    "zenexr",
    "zenpsd",
    "zenivf",
    "zenwebm",
]

[patch.crates-io]
# One unpublished core family at the gray/depth review candidate. Members use registry
# requirements so downstream consumers can choose one family with their root patch.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d037d510104406836ad9e821dbc37398b5fab72a" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "d037d510104406836ad9e821dbc37398b5fab72a" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "d037d510104406836ad9e821dbc37398b5fab72a" }
zencodec-media = { git = "https://github.com/imazen/zencodec", rev = "d037d510104406836ad9e821dbc37398b5fab72a" }
zencodec-media-testkit = { git = "https://github.com/imazen/zencodec", rev = "d037d510104406836ad9e821dbc37398b5fab72a" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "d037d510104406836ad9e821dbc37398b5fab72a" }
# Paired precision/conversion APIs consumed by this shared core.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "b6b12bbe702e7ca2f93db559858ae1f233a066ec" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "b6b12bbe702e7ca2f93db559858ae1f233a066ec" }
# zenjpeg depends on ultrahdr-core; crates.io 0.6.0 is on zencodec 0.1. zenpipe's revision
# is on the 0.2 core above.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "85cc309c07526341e6fa8b7e4d6130aaf64c8fea" }
# Pinned PDF stream resource-limit fork used by zenpdf.
hayro-syntax = { git = "https://github.com/lilith/hayro", rev = "2ce50d0164878b8505e118f81dcb1d0367b26957" }

# zenjpeg 0.9.0 (unreleased; byte-exact with libjpeg-turbo, 12-bit and lossless decode) for
# zentiff's JPEG pages. This current adapter source accepts the shared pixel generation;
# full cohort qualification still needs compatible archmage resolution before landing.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "a8ebcd0bfc401b9b783846223f5b2a50a971cce1" }

# Pinned TIFF scratch-buffer resource-limit fork used by zentiff.
tiff = { git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5" }

garb = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }

zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "d037d510104406836ad9e821dbc37398b5fab72a" }
zenresize = { git = "https://github.com/imazen/zenresize", rev = "79896144f706471f5b01189eda5797514cc87acd" }
zenflate = { git = "https://github.com/imazen/zenflate", rev = "6832cd2e0057e3a378fd6ec8f51922e6d39e23a1" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "02a7f0df5f72dd79b0afa58d66ced7cdd8395e31" }
