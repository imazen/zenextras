name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # `github.head_ref` is set ONLY on pull_request events. On a push it is
  # empty, so the group fell through to `github.run_id` — unique per run,
  # so pushes never collided and nothing was ever cancelled. `github.ref`
  # is set on both event types (`refs/heads/main` on push,
  # `refs/pull/N/merge` on a PR), so PR behaviour is unchanged while
  # consecutive pushes to a branch now supersede each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # ==========================================================================
  # Native testing (6-platform matrix)
  # ==========================================================================
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: ubuntu-24.04-arm, name: Linux aarch64 }
          - { os: macos-latest, name: macOS arm64 }
          - { os: windows-latest, name: Windows x64 }
          - { os: windows-11-arm, name: Windows arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test inventory disabled and sans-I/O with zencodec enabled
        run: cargo test -p zentiff --features zencodec --test inventory_feature --test shared_contracts --test sansio

      - name: Test JPEG 2000 inventory disabled
        run: cargo test -p zenjp2 --test inventory_feature --test shared_contracts --test sansio

      - name: Test EXR inventory disabled
        run: cargo test -p zenexr --features zencodec --test inventory_feature

      - name: Test PDF inventory disabled
        run: cargo test -p zenpdf --test inventory_feature --test shared_contracts --test sansio

      - name: Test SVG inventory disabled
        run: cargo test -p zensvg --no-default-features --test inventory_feature --test shared_contracts --test sansio

      - name: Test PSD inventory disabled
        run: cargo test -p zenpsd --test inventory_feature --test shared_contracts --test sansio

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Check no-default-features cores
        run: cargo check --workspace --no-default-features

  # ==========================================================================
  # Cross-compiled 32-bit testing (i686 via QEMU)
  # ==========================================================================
  test-i686:
    name: Test i686
    runs-on: ubuntu-latest
    env:
      CODEC_CORPUS_CACHE: target/corpus-cache
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686

      - name: Test JPEG 2000 inventory (i686/QEMU)
        run: cross test -p zenjp2 --features inventory --target i686-unknown-linux-gnu --lib --test inventory --test inventory_review --test inventory_feature --test fuzz_regression --test shared_contracts --test sansio

      - name: Test EXR inventory (i686/QEMU)
        run: cross test -p zenexr --features inventory --target i686-unknown-linux-gnu --lib --tests

      - name: Test PDF inventory (i686/QEMU)
        run: cross test -p zenpdf --features inventory --target i686-unknown-linux-gnu --lib --test inventory --test inventory_feature --test fuzz_regression --test shared_contracts --test sansio

      - name: Test SVG inventory (i686/QEMU)
        run: cross test -p zensvg --features inventory --target i686-unknown-linux-gnu --lib --test inventory_feature --test integration --test review_adversarial --test fuzz_regression --test shared_contracts --test sansio

      - name: Test PSD inventory (i686/QEMU)
        run: cross test -p zenpsd --features inventory --target i686-unknown-linux-gnu --lib --test inventory --test inventory_feature --test shared_contracts --test sansio

      - name: Test TIFF inventory (i686/QEMU)
        run: cross test -p zentiff --features inventory --test inventory_feature --test inventory --test fuzz_regression --target i686-unknown-linux-gnu --test shared_contracts --test sansio

      - name: Test (i686/QEMU)
        run: cross test --workspace --target i686-unknown-linux-gnu

  # ==========================================================================
  # WASM check (zentiff's no_std core is the wasm-relevant surface)
  # ==========================================================================
  wasm:
    name: WASM (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check WASM inventory
        run: cargo check -p zentiff --no-default-features --features inventory --target wasm32-wasip1

      - name: Check WASM (zentiff no_std core)
        run: cargo check -p zentiff --no-default-features --target wasm32-wasip1

  # ==========================================================================
  # Clippy
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ==========================================================================
  # Format check
  # ==========================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  # ==========================================================================
  # MSRV check (workspace max: zentiff rust-version = 1.99, for the image-tiff fork it patches in)
  # ==========================================================================
  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.99.0 --no-self-update --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo +1.99.0 check --workspace --all-features

  tiff-inventory-oracle:
    name: TIFF inventory independent reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Compare directory and value byte ranges
        env:
          INVENTORY_ORACLE_EXIFTOOL: exiftool
        run: cargo test -p zentiff --features inventory --test inventory exiftool_oracle_agrees -- --nocapture

  pdf-inventory-oracle:
    name: PDF inventory independent readers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install MuPDF and ExifTool
        run: sudo apt-get update && sudo apt-get install -y mupdf-tools libimage-exiftool-perl
      - name: Compare PDF objects and metadata
        env:
          INVENTORY_ORACLE_MUTOOL: mutool
          INVENTORY_ORACLE_EXIFTOOL: exiftool
          INVENTORY_ORACLE_PDF_DIR: ${{ github.workspace }}/zenpdf/tests/fixtures
        run: cargo test -p zenpdf --features inventory --test inventory oracle_mutool_exiftool -- --nocapture
