[package]
name = "zenvp8"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/imazen/zenextras"
publish = false
description = "Pure-Rust VP8 video codec (#![forbid(unsafe_code)], #![no_std] + alloc) with zencodec-media sessions"
categories = ["multimedia::video"]
keywords = ["vp8", "video", "codec", "webm", "no-std"]
include = ["/src/**", "/README.md", "/PORTED-FROM.md", "/LICENSE*"]

[features]
default = ["std"]
std = ["zencodec?/std"]
encoder = []
media = ["dep:enough", "dep:zencodec", "dep:zencodec-media", "dep:zenpixels"]

[dependencies]
enough = { version = "0.4.5", default-features = false, optional = true }
zencodec = { version = ">=0.3.0, <0.5.0", default-features = false, optional = true }
zencodec-media = { version = "0.2.0", optional = true }
zenpixels = { version = ">=0.5.0, <0.6.0", default-features = false, optional = true }

[dev-dependencies]
zencodec = { version = ">=0.3.0, <0.5.0" }
zencodec-media = { version = "0.2.0" }
zencodec-media-testkit = { version = "0.2.0" }
zenivf = { path = "../zenivf" }
zenwebm = { path = "../zenwebm" }

[lints.rust]
unsafe_code = "forbid"
