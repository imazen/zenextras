[package]
name = "zenpdf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"

# The inventory target drives the zencodec trait.
zencodec = ">=0.2.0, <0.4.0"

[dependencies.zenpdf]
path = ".."
features = ["inventory"]

[[bin]]
name = "fuzz_render"
path = "fuzz_targets/fuzz_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_render_pages"
path = "fuzz_targets/fuzz_render_pages.rs"
test = false
doc = false
bench = false

[workspace]

# This fuzz crate is its own workspace, so it repeats the parent's patches:
# the zencodec 0.2 core family (main f02a17ec; swap for the release) and
# the hayro-syntax fork the decoder ships with.
[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "283655c5424e0ad7ebc6d2acd94670fac1e29158" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "283655c5424e0ad7ebc6d2acd94670fac1e29158" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "feb09f9fd25e90e49a30d7161db8f3b558dfb2a6" }
hayro-syntax = { git = "https://github.com/lilith/hayro", rev = "2ce50d0164878b8505e118f81dcb1d0367b26957" }
