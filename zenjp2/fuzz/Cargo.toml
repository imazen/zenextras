[package]
name = "zenjp2-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
zencodec = ">=0.2.0, <0.3.0"

[dependencies.zenjp2]
path = ".."
features = ["inventory"]

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[workspace]

# The parent workspace's zencodec 0.2 core family (zenpipe's 6214c93c). Swap for the
# released version before merge.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "6214c93c24d35769a34a9561fe844c717e4d3a3a" }
