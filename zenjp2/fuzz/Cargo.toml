[package]
name = "zenjp2-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
zencodec = ">=0.1.26, <0.3.0"

[dependencies.zenjp2]
path = ".."

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[workspace]

# Inventory API (imazen/zencodec#133). Swap for the released version before merge.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", branch = "feat/inventory" }
