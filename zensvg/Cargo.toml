[package]
name = "zensvg"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "SVG rendering and lossless optimization with zencodec integration"
categories = ["multimedia::images", "graphics"]
keywords = ["svg", "svgz", "render", "optimize", "image"]
repository = "https://github.com/imazen/zenextras"
documentation = "https://docs.rs/zensvg"
# README.md stays in the package: src/lib.rs does `#![doc = include_str!("../README.md")]`
# (it is the docs.rs source). README.crates.md is the crates.io-rendered copy.
readme = "README.crates.md"
include = ["/src/**", "/README.md", "/README.crates.md", "/CHANGELOG.md", "/LICENSE*"]

[lib]
name = "zensvg"

[dependencies]
resvg = "0.48.1"
usvg = "0.48.1"
tiny-skia = "0.12.0"

# zencodec integration
zencodec = ">=0.1.26, <0.3.0"
zenpixels = ">=0.2.10, <0.4.0"
enough = "0.4.4"
whereat = "0.1.5"

# SVGZ: the optimizer compresses with it; the inventory inflates to find
# the deflate stream's end (the same flate2 usvg decompresses with).
flate2 = "1.1.10"

# The structural inventory replays usvg's own parsing: the same CSS
# (simplecss), attribute-value (svgtypes), data-URI (data-url) and image
# sniffing (imagesize) crates and versions usvg 0.48.1 uses, so no new
# package enters the dependency graph.
simplecss = "0.2.2"
svgtypes = "0.16.1"
data-url = "0.3.2"
imagesize = "0.15.0"

# SVG optimization (optional)
quick-xml = { version = "0.42.0", optional = true }

[features]
default = ["std", "text"]
std = []
text = []
optimize = ["dep:quick-xml"]

[dev-dependencies]
zenbench = "0.1.10"
# zencodec conformance harness. Provides check_decode_truncation_series
# (EOF/truncation).
zencodec-testkit = ">=0.1.0, <0.3.0"

[[bench]]
name = "arm_decode"
harness = false
