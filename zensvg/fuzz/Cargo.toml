[package]
name = "zensvg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"

# The inventory target drives the zencodec trait.
zencodec = ">=0.2.0, <0.3.0"

[dependencies.zensvg]
path = ".."
default-features = false
features = ["inventory"]

[[bin]]
name = "fuzz_render"
path = "fuzz_targets/fuzz_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[workspace]

# This fuzz crate is its own workspace, so it repeats the parent's zencodec
# patch (the 0.2 core family at zenpipe's 6214c93c; swap for the release).
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "6214c93c24d35769a34a9561fe844c717e4d3a3a" }
