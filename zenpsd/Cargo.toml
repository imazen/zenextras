[package]
name = "zenpsd"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
description = "Adobe Photoshop PSD/PSB merged-render decoder with zencodec integration"
categories = ["multimedia::images"]
keywords = ["psd", "psb", "photoshop", "image", "codec"]
repository = "https://github.com/imazen/zenextras"
documentation = "https://docs.rs/zenpsd"
readme = "README.crates.md"
include = ["/src/**", "/README.md", "/README.crates.md", "/CHANGELOG.md", "/LICENSE*"]

[lib]
name = "zenpsd"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
zencodec = { optional = true, version = ">=0.1.26, <0.3.0" }
zenpixels = { version = ">=0.2.10, <0.4.0", default-features = false }
whereat = { version = "0.1.5", default-features = false }
enough = { version = "0.4.4", default-features = false }
thiserror = { version = "2.0.21", default-features = false }

[features]
default = ["std", "zencodec"]
std = ["enough/std", "whereat/std"]
zencodec = ["dep:zencodec"]
inventory = ["zencodec"]

[dev-dependencies]
zenbench = "0.1.10"
zencodec-testkit = ">=0.1.0, <0.3.0"

[[test]]
name = "inventory"
required-features = ["inventory"]

[[test]]
name = "sansio"
required-features = ["zencodec"]

[[test]]
name = "shared_contracts"
required-features = ["zencodec"]

[[test]]
name = "inventory_feature"
required-features = ["zencodec"]
