[package]
name = "zenwebm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Sans-I/O WebM demuxer and muxer implementing the zencodec-media container contracts"
categories = ["multimedia::video", "parser-implementations"]
keywords = ["webm", "matroska", "av1", "container", "sans-io"]
repository = "https://github.com/imazen/zenextras"
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
# zencodec-media is unpublished.
publish = false

[dependencies]
zencodec = { version = ">=0.2.0, <0.4.0", default-features = false }
zencodec-media = { version = "0.1.0" }

[dev-dependencies]
zencodec-media-testkit = { version = "0.1.0" }
zencodec-io = { version = "0.1.0" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
