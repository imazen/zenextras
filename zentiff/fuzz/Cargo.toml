[package]
name = "zentiff-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
enough = { version = "0.4.3", default-features = false }
zencodec = ">=0.1.26, <0.3.0"

[dependencies.zentiff]
path = ".."
features = ["all-codecs", "zencodec"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[patch.crates-io]
fax = { path = "../../../fax" }
# zencodec PR imazen/zencodec#133 (`feat/inventory`); swap for the release before merge.
zencodec = { git = "https://github.com/imazen/zencodec", branch = "feat/inventory" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_limits"
path = "fuzz_targets/fuzz_decode_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false
