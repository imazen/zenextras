[package]
name = "zentiff-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
inventory = ["zentiff/inventory", "dep:zencodec"]

[dependencies]
zencodec = { version = ">=0.2.0, <0.4.0", optional = true }
libfuzzer-sys = "0.4.13"
enough = { version = "0.4.3", default-features = false }

[dependencies.zentiff]
path = ".."
features = ["all-codecs"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "96c7b1efb10e0a645c6854294178c33f4bad7865" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "96c7b1efb10e0a645c6854294178c33f4bad7865" }
tiff = { git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "f02a17ec6001a9efcad1267f92a3ea928ed06e57" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "f02a17ec6001a9efcad1267f92a3ea928ed06e57" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "d099267c37b4f91b35fe5f15ddb680455e1d4bd8" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "7eaa493c2b510428cb014e072f77559453627e17" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "8ca647c525cf488c61bbf35475ca8ba3db6b628e" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_limits"
path = "fuzz_targets/fuzz_decode_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
required-features = ["inventory"]
test = false
doc = false
bench = false
